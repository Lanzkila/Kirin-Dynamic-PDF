<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kirin PDF Reader | Local Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id='main-wrapper'>
    <div class='tab-bar' id='tabBar'>
      <button class='add-tab-btn' onclick='addNewTab()'>+</button>
    </div>

    <header>
      <input accept='.pdf,.cbz,.zip' id='localFile' onchange='loadLocalFile(this)' style='display:none' type='file'/>
      <button class='btn-folder' onclick='document.getElementById(&quot;localFile&quot;).click()'>
        <span>📁 BUKA FAIL</span>
      </button>
    </header>
    
    <div id="content-area">
</div>

<div class="loader-tag" id="loader">Rendering Pages...</div>
    
 <script src="scripts.js"></script>
</body>
</html>
