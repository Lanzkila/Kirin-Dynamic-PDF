<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kirin PDF Reader | Local Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0f0f0f; color: #efefef; font-family: sans-serif; overflow: hidden; }
        #main-wrapper { display: flex; flex-direction: column; height: 100vh; }

        /* Tab Bar */
        .tab-bar { background: #1a1a1a; display: flex; padding: 8px 5px 0 5px; gap: 4px; border-bottom: 1px solid #333; overflow-x: auto; align-items: flex-end; }
        .tab-bar::-webkit-scrollbar { display: none; }

        .tab { 
            background: #2b2b2b; color: #9aa0a6; padding: 8px 12px; border-radius: 8px 8px 0 0; 
            font-size: 11px; cursor: pointer; min-width: 100px; flex-shrink: 0; 
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            border: 1px solid transparent; transition: 0.2s; position: relative;
        }
        .tab.active { background: #000; color: #fff; border: 1px solid #333; border-bottom: 1px solid #000; margin-bottom: -1px; z-index: 2; }

        .close-btn { font-size: 14px; font-weight: bold; opacity: 0.5; transition: 0.3s; padding: 2px 6px; border-radius: 4px; line-height: 1; }
        .close-btn:hover { color: #fff; background: #ff3e3e; opacity: 1; }

        .add-tab-btn { background: #333; color: #fff; border: none; padding: 5px 12px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-left: 5px; }
        .add-tab-btn:hover { background: #ff3e3e; }

        /* Header (Hanya butang Folder) */
        header { background: #35363a; padding: 10px; display: flex; justify-content: center; border-bottom: 1px solid #202124; }
        .btn-folder { background: #ff3e3e; border: none; color: #fff; padding: 10px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; transition: 0.2s; }
        .btn-folder:hover { background: #cc0000; transform: scale(1.05); }

        /* Viewer Area */
        #content-area { flex: 1; background: #000; position: relative; overflow: hidden; }
        .slot { width: 100%; height: 100%; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 0; }
        .slot.active { display: block; }

        canvas { display: block; margin: 0 auto 15px auto; max-width: 95%; height: auto !important; box-shadow: 0 0 15px rgba(0,0,0,0.8); }
        .empty-view { display: flex; align-items: center; justify-content: center; height: 100%; color: #444; font-size: 13px; text-align:center; flex-direction: column; gap: 10px; }
        
        @media (min-width: 1024px) {
            .slot::-webkit-scrollbar { width: 8px; background-color: #0f0f0f; }
            .slot::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
            .slot::-webkit-scrollbar-thumb:hover { background: #ff3e3e; }
        }

        .loader-tag { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff3e3e; padding: 5px 15px; border-radius: 20px; font-size: 10px; display: none; z-index: 100; }
    </style>
</head>
<body>

<div id="main-wrapper">
    <div class="tab-bar" id="tabBar">
        <button class="add-tab-btn" onclick="addNewTab()">+</button>
    </div>

    <header>
        <input accept=".pdf" id="localFile" onchange="loadLocalPDF(this)" style="display:none" type="file">
        <button class="btn-folder" onclick="document.getElementById('localFile').click()">
            <span>📁 Buka PDF</span>
        </button>
    </header>

    <div id="content-area">
        </div>
</div>

<div class="loader-tag" id="loader">Rendering Pages...</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js';

    let tabs = [];
    let currentTabId = null;
    let tabCounter = 0;

    function addNewTab() {
        if (tabs.length >= 10) return;
        tabCounter++;
        const id = tabCounter;
        tabs.push(id);

        const tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.id = `tab-${id}`;
        tabEl.setAttribute('onclick', `switchTab(${id})`);
        tabEl.innerHTML = `<span id="title-${id}">Tab ${id}</span><span class="close-btn" onclick="closeTab(${id}, event)">×</span>`;
        
        const tabBar = document.getElementById('tabBar');
        tabBar.insertBefore(tabEl, tabBar.lastElementChild);

        const slotEl = document.createElement('div');
        slotEl.className = 'slot';
        slotEl.id = `slot-${id}`;
        slotEl.innerHTML = `<div class="empty-view">Sila klik butang 📁 di atas<br>untuk memuatkan PDF dalam Tab ${id}</div>`;
        document.getElementById('content-area').appendChild(slotEl);

        switchTab(id);
    }

    function switchTab(id) {
        currentTabId = id;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
        document.getElementById(`tab-${id}`).classList.add('active');
        document.getElementById(`slot-${id}`).classList.add('active');
    }

    function closeTab(id, event) {
        event.stopPropagation();
        if (tabs.length <= 1) return;
        tabs = tabs.filter(t => t !== id);
        document.getElementById(`tab-${id}`).remove();
        document.getElementById(`slot-${id}`).remove();
        if (currentTabId === id) {
            switchTab(tabs[tabs.length - 1]);
        }
    }

    async function renderPDF(source, id) {
        const slot = document.getElementById(`slot-${id}`);
        const loader = document.getElementById('loader');
        slot.innerHTML = '';
        loader.style.display = 'block';

        try {
            const pdf = await pdfjsLib.getDocument(source).promise;
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                slot.appendChild(canvas);
            }
        } catch (e) {
            slot.innerHTML = `<div class="empty-view" style="color:#ff3e3e">Gagal render. Sila cuba file lain.</div>`;
        }
        loader.style.display = 'none';
    }

    function loadLocalPDF(input) {
        if (input.files && input.files[0] && currentTabId) {
            const file = input.files[0];
            const reader = new FileReader();
            const targetId = currentTabId;
            reader.onload = function() {
                const data = new Uint8Array(this.result);
                renderPDF(data, targetId);
                document.getElementById(`title-${targetId}`).innerText = file.name.substring(0,10);
            };
            reader.readAsArrayBuffer(file);
            input.value = '';
        }
    }

    addNewTab();
</script>
</body>
</html>
